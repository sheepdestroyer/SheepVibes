name: Run Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Start a Redis service container for the job
      redis:
        image: redis:alpine
        # Expose port 6379 on the service container to be mapped to the host
        ports:
          - 6379:6379
        # Health check for a passwordless Redis service.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip' # Cache pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-dev.txt

    - name: Run unit tests
      env:
        CACHE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        PYTHONPATH: .
      run: |
        python -m pytest -c tests/pytest.ini tests/unit -v

    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium --with-deps

    - name: Run E2E tests
      env:
        CACHE_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        E2E_SERVER_PORT: 5099
        PYTHONPATH: .
      run: |
        python -m pytest -c tests/pytest.ini tests/e2e -v --browser chromium
